default_api: yunwu_gpt_4o_chat

apis:
  yunwu_gpt_4o_chat:
    provider: yunwu
    family: gpt
    protocol: openai_chat
    base_url: https://yunwu.ai/v1
    api_key_env: YUNWU_GPT_API_KEY
    default_model: gpt-4o-2024-08-06
    temperature: 0.7
    max_retries: 5
    retry_base_delay: 1

  yunwu_gemini_25_pro_chat:
    provider: yunwu
    family: gemini
    protocol: openai_chat
    base_url: https://yunwu.ai/v1
    api_key_env: YUNWU_GEMINI_API_KEY
    default_model: gemini-2.5-pro
    temperature: 0.7
    max_retries: 5
    retry_base_delay: 1

  deepseek_official_chat:
    provider: deepseek_official
    family: deepseek
    protocol: openai_chat
    base_url: https://api.deepseek.com
    api_key_env: DEEPSEEK_API_KEY
    default_model: deepseek-v4-pro
    temperature: 0.7
    max_retries: 5
    retry_base_delay: 1

  deepseek_official_flash:
    provider: deepseek_official
    family: deepseek
    protocol: openai_chat
    base_url: https://api.deepseek.com
    api_key_env: DEEPSEEK_API_KEY
    default_model: deepseek-v4-flash
    temperature: 0.7
    max_retries: 5
    retry_base_delay: 1

# Stage → API/Model/Temperature 路由映射
stage_routing:
  metadata_extraction:
    api: deepseek_official_flash
    model: deepseek-v4-flash
    temperature: 0
  attribute_tree:
    api: deepseek_official_flash
    model: deepseek-v4-flash
    temperature: 0.7
  section_detection:
    api: deepseek_official_flash
    model: deepseek-v4-flash
    temperature: 0
  paper_structure:
    api: deepseek_official_flash
    model: deepseek-v4-flash
    temperature: 0
  summary_report_generation:
    api: deepseek_official_chat
    model: deepseek-v4-pro
    temperature: 0.7
  deep_report_generation:
    api: deepseek_official_chat
    model: deepseek-v4-pro
    temperature: 0.7
  translation:
    api: deepseek_official_flash
    model: deepseek-v4-flash
    temperature: 0.3
  chat_interaction:
    api: deepseek_official_chat
    model: deepseek-v4-pro
    temperature: 0.7