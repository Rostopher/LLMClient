default_api: deepseek_official_flash

# 每个 profile 支持可选键 `backend: native|ppai`（缺省 = native）。
# ppai = 通过本地 pp_ai 包（import 名 pi_ai）的 openai-completions 实现收发请求，
# 计费/记录 schema 与 native 完全一致。也可用环境变量 LLM_BACKEND 全局切换，
# 优先级：显式参数 > LLM_BACKEND > 此处的 profile 键 > native。
# 灰度期间不要给任何现有 profile 默认开启 ppai。
apis:
  yunwu_gpt_4o_chat:
    provider: yunwu
    family: gpt
    protocol: openai_chat
    base_url: https://yunwu.ai/v1
    api_key_env: YUNWU_GPT_API_KEY
    default_model: gpt-4o-2024-08-06
    temperature: 0.7
    max_retries: 5
    retry_base_delay: 1

  openlux_gpt_4o_chat:
    provider: openlux
    family: gpt
    protocol: openai_chat
    base_url: https://api.openlux.ai/v1
    api_key_env: OPENLUX_API_KEY
    default_model: gpt-4o-2024-08-06
    temperature: 0.7
    max_retries: 5
    retry_base_delay: 1

  openlux_gemini_25_pro_chat:
    provider: openlux
    family: gemini
    protocol: openai_chat
    base_url: https://api.openlux.ai/v1
    api_key_env: OPENLUX_API_KEY
    default_model: gemini-2.5-pro
    temperature: 0.7
    max_retries: 5
    retry_base_delay: 1

  # 报告生成对比实验用（模型 ID 待 key 配好后经 /v1/models 核对）
  openlux_gpt56_chat:
    provider: openlux
    family: gpt
    protocol: openai_chat
    base_url: https://api.openlux.ai/v1
    api_key_env: OPENLUX_API_KEY
    default_model: gpt-5.6-sol
    temperature: 0.7
    max_retries: 5
    retry_base_delay: 1

  openlux_fable_chat:
    provider: openlux
    family: claude
    protocol: openai_chat
    base_url: https://api.openlux.ai/v1
    api_key_env: OPENLUX_API_KEY
    default_model: claude-fable-5
    temperature: 0.7
    max_retries: 5
    retry_base_delay: 1

  openlux_gemini_37_flash_chat:
    provider: openlux
    family: gemini
    protocol: openai_chat
    base_url: https://api.openlux.ai/v1
    api_key_env: OPENLUX_API_KEY
    default_model: gemini-3.7-flash
    temperature: 0.7
    max_retries: 5
    retry_base_delay: 1

  yunwu_gemini_25_pro_chat:
    provider: yunwu
    family: gemini
    protocol: openai_chat
    base_url: https://yunwu.ai/v1
    api_key_env: YUNWU_GEMINI_API_KEY
    default_model: gemini-2.5-pro
    temperature: 0.7
    max_retries: 5
    retry_base_delay: 1

  deepseek_official_chat:
    reasoning_effort: high
    extra_body:
      thinking:
        type: enabled
    provider: deepseek_official
    family: deepseek
    protocol: openai_chat
    base_url: https://api.deepseek.com
    api_key_env: DEEPSEEK_API_KEY
    default_model: deepseek-v4-pro
    temperature: 0.7
    max_retries: 5
    retry_base_delay: 1

  deepseek_official_flash:
    reasoning_effort: high
    extra_body:
      thinking:
        type: enabled
    provider: deepseek_official
    family: deepseek
    protocol: openai_chat
    base_url: https://api.deepseek.com
    api_key_env: DEEPSEEK_API_KEY
    default_model: deepseek-v4-flash
    temperature: 0.7
    max_retries: 5
    retry_base_delay: 1

  # 2026-08-21 上线的视觉版（与 v4-flash 逐格同价，每图计费封顶 ~384 token）
  # thinking 默认开启——报告生成需要写作质量，不传 extra_body 关闭
  deepseek_official_flash_vision:
    provider: deepseek_official
    family: deepseek
    protocol: openai_chat
    base_url: https://api.deepseek.com
    api_key_env: DEEPSEEK_API_KEY
    default_model: deepseek-v4-flash-vision-exp
    temperature: 0.7
    max_retries: 5
    retry_base_delay: 1

  opencode_go_deepseek_pro:
    provider: opencode_go
    family: deepseek
    protocol: openai_chat
    base_url: https://opencode.ai/zen/go/v1
    api_key_env: OPENCODE_GO_API_KEY
    default_model: deepseek-v4-pro
    temperature: 0.7
    max_retries: 5
    retry_base_delay: 1

  opencode_go_deepseek_flash:
    provider: opencode_go
    family: deepseek
    protocol: openai_chat
    base_url: https://opencode.ai/zen/go/v1
    api_key_env: OPENCODE_GO_API_KEY
    default_model: deepseek-v4-flash
    temperature: 0.7
    max_retries: 5
    retry_base_delay: 1

# Stage → API/Model/Temperature 路由映射
# 说明：统一走 deepseek 官方直连（deepseek_official_flash），
# 官方 context caching 自动生效且返回 prompt_cache_hit_tokens 计量字段；
# opencode_go 等第三方网关是否透传缓存未验证，暂不作为主力路由。
stage_routing:
  metadata_extraction:
    api: deepseek_official_flash
    model: deepseek-v4-flash
    temperature: 0
  attribute_tree:
    api: deepseek_official_flash
    model: deepseek-v4-flash
    temperature: 0.7
  section_detection:
    api: deepseek_official_flash
    model: deepseek-v4-flash
    temperature: 0
  paper_structure:
    api: deepseek_official_flash
    model: deepseek-v4-flash
    temperature: 0
  summary_report_generation:
    api: deepseek_official_flash
    model: deepseek-v4-flash
    temperature: 0.7
  deep_report_generation:
    api: deepseek_official_flash
    model: deepseek-v4-flash
    temperature: 0.7
  translation:
    api: deepseek_official_flash
    model: deepseek-v4-flash
    temperature: 0.3
  chat_interaction:
    api: deepseek_official_flash
    model: deepseek-v4-flash
    temperature: 0.7
